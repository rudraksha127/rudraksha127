name: Validate profile README

on:
  push:
    branches: [main, "portfolio/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 5
    name: Check README links and visual assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install -r requirements-profile.txt

      - name: Test validator
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Validate local links, anchors, placeholders, and SVG assets
        run: python scripts/validate_profile.py
