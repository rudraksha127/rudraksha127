name: Validate profile README

on:
  push:
    branches: [main, "portfolio/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check README links and visual assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate local links, anchors, placeholders, and SVG assets
        run: python scripts/validate_profile.py
