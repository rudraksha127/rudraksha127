<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Rudraksh Udiya — Full-Stack Engineering and Applied AI</title>
  <desc id="desc">A clean, dark navy and violet developer banner with cyan accents, an abstract dimensional orbital sphere, and a concise internship-focused headline.</desc>
  <defs>
